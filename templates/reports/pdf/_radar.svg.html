{% load l10n %}{% localize off %}<svg width="{{ radar.width }}" height="{{ radar.height }}" viewBox="{{ radar.view_box }}" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <g fill="none" stroke="#e5e7eb" stroke-width="0.6">
    {% for ring in radar.rings %}<polygon points="{{ ring }}"/>{% endfor %}
    {% for a in radar.axes %}<line x1="{{ a.x1 }}" y1="{{ a.y1 }}" x2="{{ a.x2 }}" y2="{{ a.y2 }}"/>{% endfor %}
  </g>
  <polygon points="{{ radar.others }}" fill="#4f46e5" fill-opacity="0.16" stroke="#4f46e5" stroke-width="1.4"/>
  {% if radar.self %}<polygon points="{{ radar.self }}" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2"/>{% endif %}
  <g font-size="9" fill="#374151">
    {% for a in radar.axes %}<text x="{{ a.lx }}" y="{{ a.ly }}" text-anchor="{{ a.anchor }}">{{ a.label }}</text>{% endfor %}
  </g>
</svg>
{% endlocalize %}
