{% load l10n %}{% localize off %}{% widthratio bars|length 1 22 as rows_h %}<svg width="{{ width }}" height="{{ rows_h }}" viewBox="0 0 {{ width }} {{ rows_h }}" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="9">
  {% for b in bars %}
  <text x="0" y="{{ b.y|add:9 }}" fill="#374151">{{ b.label }}</text>
  <rect x="120" y="{{ b.y|add:2 }}" width="{{ b.others_w|unlocalize }}" height="7" rx="2" fill="#4f46e5"/>
  <rect x="120" y="{{ b.y|add:10 }}" width="{{ b.self_w|unlocalize }}" height="6" rx="2" fill="#a7f3d0"/>
  {% endfor %}
</svg>
{% endlocalize %}
