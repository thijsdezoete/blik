<div class="oc-slot oc-slot-filled" data-team-uuid="{{ team.uuid }}">
    <span class="oc-chip"
          draggable="true"
          data-reviewee-uuid="{{ slot.reviewee.uuid }}"
          data-reviewee-name="{{ slot.reviewee.name }}"
          data-reviewee-email="{{ slot.reviewee.email }}"
          data-team-uuid="{{ team.uuid }}"
          title="{{ slot.reviewee.name }} ({{ slot.reviewee.email }})">
        <span class="oc-chip-name">{{ slot.reviewee.name }}</span>
        {% if slot.is_multi_team %}<span class="oc-chip-badge" title="Also on: {{ slot.other_teams_label }}">▣</span>{% endif %}
        <button type="button" class="oc-chip-remove"
                data-membership-id="{{ slot.membership.id }}"
                aria-label="Remove {{ slot.reviewee.name }} from this team">×</button>
    </span>
</div>
