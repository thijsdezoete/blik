{# Usage: {% include 'emails/_button.html' with url=some_url label=_('Do the thing') %} #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0;">
  <tr><td style="background:#4f46e5; border-radius:6px;">
    <a href="{{ url }}" style="display:inline-block; padding:12px 28px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">{{ label }}</a>
  </td></tr>
</table>
