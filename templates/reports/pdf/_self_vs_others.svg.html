{% load l10n %}{% localize off %}{% widthratio bars|length 1 22 as rows_h %}<svg width="{{ width }}" height="{{ rows_h }}" viewBox="0 0 {{ width }} {{ rows_h }}" xmlns="http://www.w3.org/2000/svg" font-family="Roboto" font-size="9">
  {% for b in bars %}
  <text x="0" y="{{ b.y|add:11 }}" fill="#374151">{{ b.label }}</text>
  <rect x="{{ b.x }}" y="{{ b.y|add:2 }}" width="{{ b.others_w|unlocalize }}" height="7" rx="2" fill="#4f46e5"/>
  <rect x="{{ b.x }}" y="{{ b.y|add:10 }}" width="{{ b.self_w|unlocalize }}" height="6" rx="2" fill="#a7f3d0"/>
  {% if show_values %}{% if b.others is not None %}<text x="{{ b.x|add:b.others_w|add:4 }}" y="{{ b.y|add:9 }}" font-size="7" fill="#4f46e5">{{ b.others|floatformat:1 }}</text>{% endif %}{% if b.self is not None %}<text x="{{ b.x|add:b.self_w|add:4 }}" y="{{ b.y|add:16 }}" font-size="7" fill="#059669">{{ b.self|floatformat:1 }}</text>{% endif %}{% endif %}
  {% endfor %}
</svg>
{% endlocalize %}
